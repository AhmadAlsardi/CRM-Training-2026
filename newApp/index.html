        var currentStep = 1;
        var maxUnlockedStep = 1;
        var answersState = {};

        document.addEventListener("DOMContentLoaded", function() {
            updateStaticLabels();
            renderStepsList();
            loadStepData(currentStep);
        });

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            var root = document.getElementById('html-root');
            root.setAttribute('lang', currentLang);
            root.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');

            document.getElementById('lang-btn-text').innerText = currentLang === 'ar' ? 'English' : 'عربي';

            updateStaticLabels();
            renderStepsList();
            loadStepData(currentStep);
        }

        function updateStaticLabels() {
            var t = uiTranslations[currentLang];
            document.getElementById('header-badge-text').innerText = t.headerBadge;
            document.getElementById('header-app-title').innerText = t.appTitle;
            document.getElementById('label-progress').innerText = t.progressLabel;
            document.getElementById('label-reset').innerText = t.resetBtn;
            document.getElementById('label-training-guide').innerText = t.trainingGuide;
            document.getElementById('label-explanation-header').innerHTML = '<svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> ' + t.explanationHeader;
            document.getElementById('label-quiz-header').innerHTML = '<svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> ' + t.quizHeader;
            document.getElementById('label-prev-btn').innerText = t.prevBtn;
            document.getElementById('label-next-btn').innerText = t.nextBtn;
        }

        function renderStepsList() {
            var container = document.getElementById('steps-list');
            container.innerHTML = '';
            var t = uiTranslations[currentLang];

            stagesData.forEach(function(stage) {
                var isUnlocked = stage.id <= maxUnlockedStep;
                var isActive = stage.id === currentStep;
                var isPassed = answersState[stage.id] === true;
                var localized = stage[currentLang];

                var stepEl = document.createElement('div');
                stepEl.className = 'p-2.5 rounded-xl border transition-all flex items-center justify-between cursor-pointer ' +
                    (isActive ? 'step-active' : isPassed ? 'step-completed' : isUnlocked ? 'bg-white hover:bg-slate-50 border-slate-200' : 'step-locked border-slate-200');

                stepEl.onclick = function() {
                    if (isUnlocked) {
                        currentStep = stage.id;
                        renderStepsList();
                        loadStepData(currentStep);
                    }
                };

                stepEl.innerHTML = `
                    <div class="flex items-center gap-2.5">
                        <div class="w-6 h-6 rounded-lg font-bold text-xs flex items-center justify-center ${
                            isPassed ? 'bg-emerald-500 text-white' : isActive ? 'bg-amber-400 text-slate-900' : 'bg-slate-100 text-slate-500'
                        }">
                            ${isPassed ? '✓' : stage.id}
                        </div>
                        <div>
                            <h4 class="text-xs font-bold ${isActive ? 'text-slate-900' : 'text-slate-700'}">${localized.title}</h4>
                            <span class="text-[10px] text-slate-400">${isPassed ? t.completed : isUnlocked ? t.available : t.locked}</span>
                        </div>
                    </div>
                    ${!isUnlocked ? '<svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 002-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>' : ''}
                `;

                container.appendChild(stepEl);
            });

            updateProgressBar();
        }

        function loadStepData(stepId) {
            var data = stagesData.find(function(s) { return s.id === stepId; });
            if (!data) return;

            var localized = data[currentLang];
            var t = uiTranslations[currentLang];

            document.getElementById('stage-title').innerText = localized.title;
            document.getElementById('current-stage-tag').innerText = t.stageTag + ' ' + data.id;
            document.getElementById('stage-description').innerHTML = localized.description;

            var quizBox = document.getElementById('quiz-box-container');
            var nextBtn = document.getElementById('next-btn');
            var nextBtnText = nextBtn.querySelector('span');
            var nextBtnSvg = nextBtn.querySelector('svg');

var isLastStage = false;

            if (isLastStage) {
                nextBtnText.innerText = t.resetBtn;
                if (nextBtnSvg) nextBtnSvg.classList.add('hidden');
                nextBtn.onclick = resetTraining;
                nextBtn.className = "px-4 py-1.5 bg-rose-600 hover:bg-rose-700 text-white font-semibold text-xs rounded-lg shadow-sm transition flex items-center gap-1";
            } else {
                nextBtnText.innerText = t.nextBtn;
                if (nextBtnSvg) nextBtnSvg.classList.remove('hidden');
                nextBtn.onclick = goToNextStep;
                nextBtn.className = "px-4 py-1.5 bg-amber-400 hover:bg-amber-500 text-slate-900 font-semibold text-xs rounded-lg shadow-sm transition disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1";
            }

            if (data.noQuiz || isLastStage) {
                quizBox.classList.add('hidden');
                answersState[data.id] = true;
                if (data.id === maxUnlockedStep && maxUnlockedStep < stagesData.length) {
                    maxUnlockedStep++;
                }
                nextBtn.disabled = false;
            } else {
                quizBox.classList.remove('hidden');
                
                if (currentQuestionIndex[data.id] === undefined) {
                    currentQuestionIndex[data.id] = 0;
                }

                var questionsList = localized.questions || [localized];
                var qIndex = currentQuestionIndex[data.id];
                if (qIndex >= questionsList.length) {
                    currentQuestionIndex[data.id] = 0;
                    qIndex = 0;
                }
                var currentQ = questionsList[qIndex];

                document.getElementById('quiz-counter').innerText = 'سؤال ' + (qIndex + 1) + ' من ' + questionsList.length;
                document.getElementById('question-text').innerText = currentQ.question;

                var optionsContainer = document.getElementById('options-container');
                optionsContainer.innerHTML = '';

                var feedbackEl = document.getElementById('feedback-message');
                feedbackEl.className = "hidden text-xs p-2.5 rounded-lg font-medium";

                currentQ.options.forEach(function(opt) {
                    var optBtn = document.createElement('button');
                    optBtn.className = "w-full text-start p-2.5 text-xs rounded-lg border border-slate-200 bg-slate-50 hover:bg-amber-50 hover:border-amber-300 transition flex items-center justify-between";
                    optBtn.innerText = opt.text;

                    optBtn.onclick = function() { checkAnswer(opt, data, questionsList); };
                    optionsContainer.appendChild(optBtn);
                });

                nextBtn.disabled = !answersState[currentStep];
            }

            var iframe = document.getElementById('preview-frame');
            iframe.src = data.src;

            document.getElementById('prev-btn').disabled = currentStep === 1;
        }

        function checkAnswer(selectedOption, stageData, questionsList) {
            var feedbackEl = document.getElementById('feedback-message');
            var t = uiTranslations[currentLang];
            feedbackEl.classList.remove('hidden');

            if (selectedOption.correct) {
                feedbackEl.className = "text-xs p-2.5 rounded-lg font-medium bg-emerald-50 text-emerald-700 border border-emerald-200";
                feedbackEl.innerText = t.correctFeedback;

                var qIndex = currentQuestionIndex[stageData.id];

                if (questionsList && qIndex < questionsList.length - 1) {
                    setTimeout(function() {
                        currentQuestionIndex[stageData.id]++;
                        loadStepData(stageData.id);
                    }, 1000);
                } else {
                    answersState[stageData.id] = true;

                    if (stageData.id === maxUnlockedStep && maxUnlockedStep < stagesData.length) {
                        maxUnlockedStep++;
                    }

                    document.getElementById('next-btn').disabled = false;
                    renderStepsList();

                    // التعديل هنا: إذا كانت المرحلة الحالية هي الأخيرة (المرحلة 7) وتم حلها بنجاح، يتحول زر التالي إلى زر إعادة الضبط الأحمر
                    if (stageData.id === stagesData.length) {
                        var nextBtn = document.getElementById('next-btn');
                        var nextBtnText = nextBtn.querySelector('span');
                        var nextBtnSvg = nextBtn.querySelector('svg');

                        nextBtnText.innerText = t.resetBtn;
                        if (nextBtnSvg) nextBtnSvg.classList.add('hidden');
                        nextBtn.onclick = resetTraining;
                        nextBtn.className = "px-4 py-1.5 bg-rose-600 hover:bg-rose-700 text-white font-semibold text-xs rounded-lg shadow-sm transition flex items-center gap-1";
                    }
                }
            } else {
                feedbackEl.className = "text-xs p-2.5 rounded-lg font-medium bg-rose-50 text-rose-700 border border-rose-200";
                feedbackEl.innerText = t.wrongFeedback;
            }
        }

        function goToNextStep() {
            if (currentStep < stagesData.length && answersState[currentStep]) {
                currentStep++;
                renderStepsList();
                loadStepData(currentStep);
            }
        }

        function goToPrevStep() {
            if (currentStep > 1) {
                currentStep--;
                renderStepsList();
                loadStepData(currentStep);
            }
        }

        function updateProgressBar() {
            var t = uiTranslations[currentLang];
            var completedCount = Object.keys(answersState).filter(function(k) { return answersState[k] === true; }).length;
            var percentage = Math.round((completedCount / stagesData.length) * 100);

            document.getElementById('progress-bar').style.width = percentage + '%';
            document.getElementById('progress-text').innerText = completedCount + ' / ' + stagesData.length;
            document.getElementById('percentage-badge').innerText = percentage + '% ' + t.completionSuffix;
        }

        function resetTraining() {
            var t = uiTranslations[currentLang];
            if (confirm(t.resetConfirm)) {
                currentStep = 1;
                maxUnlockedStep = 1;
                answersState = {};
                currentQuestionIndex = {};
                renderStepsList();
                loadStepData(currentStep);
            }
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.action === 'goToStage2') {
                currentStep = 2;
                if (maxUnlockedStep < 2) {
                    maxUnlockedStep = 2;
                }
                renderStepsList();
                loadStepData(currentStep);
            } else if (event.data && event.data.action === 'openProjectStage3') {
                if (answersState[2] === true) {
                    currentStep = 3;
                    if (maxUnlockedStep < 3) {
                        maxUnlockedStep = 3;
                    }
                    renderStepsList();
                    loadStepData(currentStep);
                } else {
                    alert('يرجى إجابة أسئلة التحقق الخاصة بالمرحلة الثانية أولاً لفتح تفاصيل المشروع!');
                }
            }
        });
