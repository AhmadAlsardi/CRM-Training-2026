<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Media - Login</title>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; margin: 0; padding: 0; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md flex flex-col items-center">
        <!-- Company Logo -->
        <div class="mb-6">
            <img src="https://system.smartmediajo.com/uploads/company/dfc3e469b7700ff50bc46af6b923e573.png" alt="Smart Media" class="h-16 object-contain">
        </div>

        <!-- LOGIN FORM VIEW -->
        <div id="login-view" class="w-full flex flex-col items-center">
            <h1 class="text-2xl font-semibold text-slate-800 mb-6">Login</h1>

            <form onsubmit="handleLogin(event)" class="w-full bg-white rounded-xl shadow-sm border border-slate-200/80 p-8 space-y-5">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1.5">Email Address</label>
                    <input type="email" required class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1.5">Password</label>
                    <input type="password" required class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="remember" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                    <label for="remember" class="text-xs text-slate-600 cursor-pointer">Remember me</label>
                </div>

                <button type="submit" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg transition shadow-sm cursor-pointer">
                    Login
                </button>

                <div>
                    <button type="button" onclick="showForgotView()" class="text-xs text-blue-600 hover:underline font-medium border-0 bg-transparent p-0 cursor-pointer">
                        Forgot Password?
                    </button>
                </div>
            </form>
        </div>

        <!-- FORGOT PASSWORD VIEW -->
        <div id="forgot-view" class="w-full hidden flex-col items-center">
            <h1 class="text-2xl font-semibold text-slate-800 mb-6">Forgot Password</h1>

            <div class="w-full bg-white rounded-xl shadow-sm border border-slate-200/80 p-8 space-y-5">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1.5">Email Address</label>
                    <input type="email" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                </div>

                <button type="button" onclick="showLoginView()" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg transition shadow-sm">
                    Confirm
                </button>

                <div class="text-center">
                    <button type="button" onclick="showLoginView()" class="text-xs text-slate-500 hover:underline font-medium border-0 bg-transparent p-0 cursor-pointer">
                        ← Back to Login
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            // إرسال الرسالة إلى index.html للتحويل إلى المرحلة الثانية
            window.parent.postMessage({ action: 'goToStage2' }, '*');
        }

        function showForgotView() {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('forgot-view').classList.remove('hidden');
        }

        function showLoginView() {
            document.getElementById('forgot-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
        }
    </script>
</body>
</html>
