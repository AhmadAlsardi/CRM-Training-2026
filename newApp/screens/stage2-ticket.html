<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ticket Information</title>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #334155; }
    </style>
</head>
<body class="p-4 space-y-4">

    <!-- Top Action Link -->
    <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-slate-200/80 shadow-sm">
        <a href="stage2-dashboard.html" class="text-xs font-semibold text-blue-600 hover:underline flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
        </a>
        <span class="text-xs font-bold text-slate-500">New Ticket Creation</span>
    </div>

    <!-- Ticket Form Panel (Matching Screenshots image_093cb4.png & image_093c7a.png) -->
    <div class="bg-white rounded-xl border border-slate-200/80 shadow-sm p-6 space-y-6">
        
        <!-- Header Title & Badge -->
        <div class="flex items-center gap-3 border-b border-slate-100 pb-4">
            <h2 class="text-base font-bold text-slate-800">Ticket Information</h2>
            <span class="px-2.5 py-1 bg-slate-100 border border-slate-200 text-slate-600 rounded-md text-xs font-medium flex items-center gap-1">
                <i class="fa-regular fa-envelope"></i> Ticket without contact
            </span>
        </div>

        <!-- Form Fields Grid -->
        <form class="space-y-4" onsubmit="event.preventDefault(); alert('Ticket Opened Successfully!'); location.href='stage2-dashboard.html';">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <!-- Left Column -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Subject</label>
                        <input type="text" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-blue-500" required>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Contact</label>
                        <select class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none">
                            <option value="">Non selected</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Name</label>
                            <input type="text" disabled class="w-full px-3 py-2 bg-slate-100 border border-slate-200 rounded-lg text-xs text-slate-400">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Email address</label>
                            <input type="email" disabled class="w-full px-3 py-2 bg-slate-100 border border-slate-200 rounded-lg text-xs text-slate-400">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Department</label>
                            <select class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none">
                                <option value="">Non selected</option>
                                <option>Motion Graphics Department</option>
                                <option>Administration Department</option>
                                <option>Marketing Department</option>
                                <option>Website & Application Department</option>
                                <option>Design & Identity Department</option>
                                <option>IT Department</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">CC</label>
                            <input type="text" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                        </div>
                    </div>
                </div>

                <!-- Right Column -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1"><i class="fa-solid fa-tag text-slate-400"></i> Tags</label>
                        <input type="text" placeholder="Tag" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Assign ticket (default is current user)</label>
                        <select class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                            <option>Interns SM</option>
                            <option>Zaid Amarneh</option>
                            <option>Yousef Badwy</option>
                            <option>Ahmad Rakan</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Priority</label>
                            <select class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                                <option>Medium</option>
                                <option>High</option>
                                <option>Low</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Service</label>
                            <div class="flex gap-1">
                                <select class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                                    <option>Non selected</option>
                                </select>
                                <button type="button" class="px-2.5 bg-slate-100 border border-slate-200 rounded-lg hover:bg-slate-200 text-xs">+</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Ticket Body Textarea Editor Bar -->
            <div class="pt-4 border-t border-slate-100 space-y-2">
                <h3 class="text-xs font-bold text-slate-700">Ticket Body</h3>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    <select class="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                        <option>Insert predefined reply</option>
                    </select>
                    <select class="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                        <option>Insert knowledge base link</option>
                    </select>
                </div>

                <!-- Rich Text Toolbar Mock -->
                <div class="border border-slate-200 rounded-xl overflow-hidden bg-white">
                    <div class="bg-slate-50 border-b border-slate-200 p-2 flex flex-wrap items-center gap-3 text-xs text-slate-600">
                        <span class="cursor-pointer hover:text-slate-900">File <i class="fa-solid fa-caret-down"></i></span>
                        <span class="cursor-pointer hover:text-slate-900">Edit <i class="fa-solid fa-caret-down"></i></span>
                        <span class="cursor-pointer hover:text-slate-900">View <i class="fa-solid fa-caret-down"></i></span>
                        <span class="cursor-pointer hover:text-slate-900">Insert <i class="fa-solid fa-caret-down"></i></span>
                        <span class="cursor-pointer hover:text-slate-900">Format <i class="fa-solid fa-caret-down"></i></span>
                        <span class="border-r border-slate-300 h-4 mx-1"></span>
                        <i class="fa-solid fa-bold cursor-pointer hover:text-slate-900"></i>
                        <i class="fa-solid fa-italic cursor-pointer hover:text-slate-900"></i>
                        <i class="fa-solid fa-align-left cursor-pointer hover:text-slate-900"></i>
                        <i class="fa-solid fa-link cursor-pointer hover:text-slate-900"></i>
                    </div>
                    <textarea rows="6" class="w-full p-3 text-xs focus:outline-none" placeholder="Type ticket body description..."></textarea>
                </div>
            </div>

            <!-- File Upload and Footer -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-2">
                <div class="flex items-center gap-2 text-xs text-slate-600">
                    <span>Attachments</span>
                    <input type="file" class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-2 py-1">
                </div>

                <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs rounded-lg transition shadow-sm">
                    Open Ticket
                </button>
            </div>
        </form>

    </div>

</body>
</html>
